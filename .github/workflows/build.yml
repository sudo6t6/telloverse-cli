name: Build Executables

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target_name: linux-64
          - os: windows-latest
            arch: x86_64
            target_name: windows-64.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name scraper_${{ matrix.target_name }} telloverse-cli.py

      - name: Create Output Directory
        run: mkdir -p exe

      - name: Move Binaries
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cp dist/*.exe exe/
          else
            cp dist/* exe/
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-binaries-${{ matrix.target_name }}
          path: exe/
